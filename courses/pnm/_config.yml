# Jupyter Book configuration — Programming & Numerical Methods
# Build with: jupyter-book build courses/pnm/

title: "Programming & Numerical Methods for Economics"
author: Juan Zurita
copyright: "2025"
logo: logo.svg

execute:
  execute_notebooks: "off"

repository:
  url: https://github.com/Juanignaciozurita/juanzurita.github.io
  path_to_book: courses/pnm
  branch: main

launch_buttons:
  colab_url: "https://colab.research.google.com"
  notebook_interface: "classic"

html:
  favicon: logo.svg
  home_page_in_navbar: true
  use_issues_button: false
  use_repository_button: true
  use_download_button: true
  extra_css:
    - _static/custom.css

sphinx:
  config:
    html_theme_options:
      primary_sidebar_end: []
      navigation_with_keys: false
