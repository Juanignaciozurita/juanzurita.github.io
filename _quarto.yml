project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "courses/pnm/index.qmd"
    - "courses/pnm/intro.md"
    - "courses/pnm/notebooks/*.ipynb"
    - "courses/dlmacro/index.qmd"
    - "courses/dlmacro/intro.md"
    - "courses/dlmacro/notebooks/*.ipynb"
    - "courses/smith-to-simulation/index.qmd"
    - "courses/smith-to-simulation/intro.md"
    - "courses/smith-to-simulation/*.ipynb"
    - "courses/optimisation/index.qmd"
    - "courses/optimisation/notebooks/*.ipynb"
    - "courses/forecasting/index.qmd"
    - "courses/forecasting/notebooks/*.ipynb"
    - "consulting/cattle-forecast/*.ipynb"
    - "!courses/pnm/New Problem Sets/"

